@if (data) {
  <div class="pnd-toast {{ data.classes || '' }}">
    <div class="pnd-toast__column">
      <!-- Toast boxes -->
      @for (box of data.toasts; track box) {
        <div class="pnd-toast__box  {{ box.classes || '' }}"
          (mouseover)="onMouseover(box._meta.id)"
          (mouseout)="onMouseout(box._meta.id)"
          [ngClass]="{ 'has-actions' : !! (box.actions || box.closeIcon) }">
             <div class="pnd-toast__progress" [ngStyle]="{
                 width: (box.progress$ | async) + '%'
             }"></div>
          <!-- Toast text -->
          @if (box.title || box.text) {
            <div class="pnd-toast__content">
              @if (box.title) {
                <span class="pnd-toast__title">{{ box.title }}</span>
              }
              @if (box.text) {
                <span class="pnd-toast__text">{{ box.text }}</span>
              }
            </div>
          }
          <!-- Toast actions -->
          @if (box.actions || box.closeIcon) {
            <div class="pnd-toast__actions">
              @if (box.closeIcon) {
                <span
                  class="pnd-toast__close-icon {{ box.closeIcon.icon }}"
                  (click)="onClick(box.closeIcon.payload)">
                  <pnd-svg-icon [data]="{ id: 'times' }"></pnd-svg-icon>
                </span>
              }
              @if (box.actions) {
                <span class="pnd-toast__action-wrapper">
                  @for (action of box.actions; track action) {
                    <span class="pnd-toast__action-content">
                      <button class="pnd-toast__action-button pnd-btn pnd-btn-s {{action.classes || ''}}"
                        (click)="onClick(action.payload)">
                        {{action.text}}
                      </button>
                    </span>
                  }
                </span>
              }
            </div>
          }
        </div>
      }
    </div>
  </div>
}
